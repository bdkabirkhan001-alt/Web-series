<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP4 Video Test</title>
  <style>
    body {
      background-color: #141414;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .player-container {
      width: 100%;
      max-width: 800px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
    h2 {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <h2>Virgin Boys Episode 1</h2>

  <div class="player-container">
    <video controls preload="metadata">
      <source src="https://video.maalcdn.com/ULLU/Virgin%20Boys/Virgin%20Boys%20E1.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

</body>
</html>
