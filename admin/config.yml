backend:
  name: github
  repo: bdkabirkhan001-alt/Web-series # আপনার GitHub username/repo_name
  branch: main # repository-র শাখা (main/master)

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "series"
    label: "Series"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}
      
